Perform a read-only review against the exact approved SPEC version and its acceptance criteria. Inspect the implementation and test evidence. Do not edit files, execute database writes, authorize work, or infer unrun test results. Report each criterion as PASS, FAIL, or NOT VERIFIED with file/line evidence and remaining risks.
"""

